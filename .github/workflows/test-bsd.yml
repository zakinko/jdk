#
# Run tier1 on a real BSD, in a virtual machine on the Linux runner.
# NetBSD, FreeBSD, OpenBSD and DragonFly each boot through their own
# vmactions action and run .github/scripts/bsd-tier1-in-vm.sh.
#
# The BSD build cross-compiles and cannot run a line of what it produces, so
# what it proves stops at "it compiles". This picks the bundles up and runs
# them on the operating system itself.
#
# tier1 takes about nine hours on a 3-core, 2GB NetBSD machine, and a hosted
# job is cut off at six. It is therefore split the way upstream's own test.yml
# splits it -- twelve parts, the largest of which measured 70 minutes on that
# machine, so each has room to spare even before the extra memory this VM gets.
#
name: 'Test (bsd)'

on:
  workflow_call:
    inputs:
      target-os:
        required: false
        type: string
        default: 'netbsd'
      platform:
        required: false
        type: string
        default: 'bsd-x86_64-netbsd'
      release:
        description: 'The BSD release to run in, the one the sysroot is from'
        required: false
        type: string
        default: '10.1'
      arch:
        description: >-
          The machine the guest runs as.  Empty is the image's own default,
          which is x86_64.  A guest whose architecture differs from the
          runner's is emulated, so aarch64 belongs with an arm64 runner.
        required: false
        type: string
        default: ''
      timeout-factor:
        description: "jtreg's TIMEOUT_FACTOR; an emulated guest needs more"
        required: false
        type: string
        default: '4'
      runner:
        description: 'The GitHub runner to boot the guest on'
        required: false
        type: string
        default: 'ubuntu-24.04'
      shards:
        description: >-
          How many jobs each part is split across, as a JSON list of the
          shard numbers, and the count.  An emulated guest runs a part for
          longer than the six hours a job may take.
        required: false
        type: string
        default: '[1]'
      shard-count:
        required: false
        type: string
        default: '1'

jobs:
  test:
    name: test
    runs-on: ${{ inputs.runner }}

    strategy:
      fail-fast: false
      matrix:
        test-name:
          - 'jdk/tier1 part 1'
          - 'jdk/tier1 part 2'
          - 'jdk/tier1 part 3'
          - 'langtools/tier1'
          - 'hs/tier1 common'
          - 'hs/tier1 compiler part 1'
          - 'hs/tier1 compiler part 2'
          - 'hs/tier1 compiler part 3'
          - 'hs/tier1 gc'
          - 'hs/tier1 runtime'
          - 'hs/tier1 serviceability'
          - 'lib-test/tier1'
        shard: ${{ fromJSON(inputs.shards) }}

        # The same twelve groups upstream's test.yml uses, so that a part
        # failing here can be compared with the same part on Linux. jaxp is
        # not among them: its tier1 selects no tests.
        include:
          - test-name: 'jdk/tier1 part 1'
            test-suite: 'test/jdk/:tier1_part1'
            test-slug: 'jdk-part1'

          - test-name: 'jdk/tier1 part 2'
            test-suite: 'test/jdk/:tier1_part2'
            test-slug: 'jdk-part2'

          - test-name: 'jdk/tier1 part 3'
            test-suite: 'test/jdk/:tier1_part3'
            test-slug: 'jdk-part3'

          - test-name: 'langtools/tier1'
            test-suite: 'test/langtools/:tier1'
            test-slug: 'langtools'

          - test-name: 'hs/tier1 common'
            test-suite: 'test/hotspot/jtreg/:tier1_common'
            test-slug: 'hs-common'

          - test-name: 'hs/tier1 compiler part 1'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_1'
            test-slug: 'hs-compiler1'

          - test-name: 'hs/tier1 compiler part 2'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_2'
            test-slug: 'hs-compiler2'

          - test-name: 'hs/tier1 compiler part 3'
            test-suite: 'test/hotspot/jtreg/:tier1_compiler_3'
            test-slug: 'hs-compiler3'

          - test-name: 'hs/tier1 gc'
            test-suite: 'test/hotspot/jtreg/:tier1_gc'
            test-slug: 'hs-gc'

          - test-name: 'hs/tier1 runtime'
            test-suite: 'test/hotspot/jtreg/:tier1_runtime'
            test-slug: 'hs-runtime'

          - test-name: 'hs/tier1 serviceability'
            test-suite: 'test/hotspot/jtreg/:tier1_serviceability'
            test-slug: 'hs-serviceability'

          - test-name: 'lib-test/tier1'
            test-suite: 'test/lib-test/:tier1'
            test-slug: 'lib-test'

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get bundles'
        id: bundles
        uses: ./.github/actions/get-bundles
        with:
          platform: ${{ inputs.platform }}

      # The VM actions copy the whole workspace into the guest, and the
      # tests use none of the symbols bundle.  FreeBSD aarch64's copy failed
      # on it with "bundles/symbols/jdk-28/lib/server/libjvm.debuginfo failed
      # verification -- update discarded" and rsync's exit code 23, before a
      # test ran.  The archives the bundles were unpacked from are not
      # needed there either.
      - name: 'Leave the symbols and the archives out of the guest'
        run: rm -rf bundles/symbols bundles/*.tar.gz

      # The FreeBSD aarch64 guest has been handed corrupt copies:
      #   tar: Damaged tar archive (bad header checksum)
      #   java.lang.ClassFormatError: Incompatible magic value 2760999382
      # and libjvm SIGILLs on its first run with no copy error at all.  ssh
      # would have caught damage in transit, so it happens in the guest.
      # Record what the JDK should look like, for the guest to check: all of
      # it, since a part with the libraries, lib/modules and bin/ intact
      # still stopped on a damaged jmod, in the jlink run the script starts
      # with: "jlink could not build a probe image; it said: Error: invalid
      # distance too far back".
      - name: 'Record the checksums of the JDK bundle'
        run: |
          cd bundles
          find jdk -type f -print0 |
            xargs -0 sha256sum > ../bundles.sha256
          wc -l ../bundles.sha256
        if: inputs.target-os == 'freebsd'

      # Whether the guest is accelerated decides whether a six-hour job is
      # enough, and it is easy to get wrong: qemu lists kvm under -accel
      # help when the binary was built with it, which says nothing about
      # this host.  The device is what counts, so print that.
      - name: 'Say whether this runner can accelerate a guest'
        run: |
          echo "runner: ${{ runner.os }} ${{ runner.arch }}"
          ls -l /dev/kvm || echo "/dev/kvm: absent, the guest will be emulated"

      # One step per BSD, because each has its own action; what runs inside
      # is the same script on all four.  prepare installs what the
      # makefiles and the script need, plus what the JDK itself links
      # against that the base system does not carry.
      - name: 'Run tests in a NetBSD virtual machine'
        uses: vmactions/netbsd-vm@v1.5.0
        with:
          release: ${{ inputs.release }}
          arch: ${{ inputs.arch }}
          mem: 8192
          cpu: 4
          usesh: true
          copyback: true
          envs: 'TEST_SUITE TIMEOUT_FACTOR SHARD SHARDS'
          # -U: the image carries some of these already, and pkg_add
          # refuses a newer version from the mirror without it -- "A
          # different version of bash-5.3.20 is already installed".  The
          # mirror has also answered "no pkg found for 'zip'" to one part
          # of twelve while the rest found it, so try a few times.  Five
          # tries at the CDN, half an hour apart in all, still ended in
          # "no pkg found for 'gmake'" on one part, so alternate with the
          # master site, which the CDN only fronts.
          prepare: |
            case `uname -m` in evbarm) a=aarch64 ;; *) a=`uname -m` ;; esac
            p=pub/pkgsrc/packages/NetBSD/$a/`uname -r`/All
            n=0
            until /usr/sbin/pkg_add -U bash gmake zip unzip; do
              n=$((n + 1)); [ $n -lt 6 ] || exit 1
              if [ $((n % 2)) = 1 ]; then h=ftp.NetBSD.org; else h=cdn.NetBSD.org; fi
              PKG_PATH=http://$h/$p; export PKG_PATH
              echo "retrying from $PKG_PATH in 30 seconds"; sleep 30
            done
          run: sh .github/scripts/bsd-tier1-in-vm.sh "$TEST_SUITE"
        env:
          TEST_SUITE: ${{ matrix.test-suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shard-count }}
        if: inputs.target-os == 'netbsd'

      # jtreg's process tests read /proc, which FreeBSD does not mount.
      - name: 'Run tests in a FreeBSD virtual machine'
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ inputs.release }}
          arch: ${{ inputs.arch }}
          mem: 8192
          cpu: 4
          usesh: true
          # Copying the whole workspace back failed after the tests had passed,
          # on a tar stream the guest damaged:
          #   [TAR STDERR] tar: Skipping to next header
          #   ##[error]Tar exited with code 2
          # The aarch64 results come back in a step of their own instead.
          copyback: ${{ inputs.arch != 'aarch64' }}
          # One aarch64 job in five died copying the workspace in, before a
          # test ran, with rsync 3.2.7 on the runner talking to 3.5.0 in the
          # guest:
          #   Invalid block index 894783089 (count=0) [receiver]
          #   rsync error: protocol incompatibility (code 2) at receiver.c(573)
          # or "connection unexpectedly closed ... (code 12)".  The x86_64
          # guests, the same image on the same release, have not.  Copy the
          # aarch64 one in with tar instead.
          sync: ${{ inputs.arch == 'aarch64' && 'tar' || 'rsync' }}
          envs: 'TEST_SUITE TIMEOUT_FACTOR SHARD SHARDS'
          prepare: |
            mount -t procfs proc /proc
            pkg install -y bash gmake zip unzip gsed gnugrep
          # On aarch64 the tests run in the next step, over the action's ssh.
          run: ${{ inputs.arch == 'aarch64' && 'echo the tests run in the next step' || 'sh .github/scripts/bsd-tier1-in-vm.sh "$TEST_SUITE"' }}
        env:
          TEST_SUITE: ${{ matrix.test-suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shard-count }}
        if: inputs.target-os == 'freebsd'

      # The FreeBSD aarch64 guest damages a file of the bundle it is copied
      # in in about one part of three -- lib/modules or lib/server/libjvm.so,
      # never the same twice in a row -- and the guest cannot reach the
      # runner to fetch one again: from 10.0.2.2 it got "Connection
      # refused" and "Operation timed out".  ssh from the runner into the
      # guest works, so check the bundle from here, send what is damaged
      # again, say how the copies differ, and then run the tests the same
      # way.  The action leaves the VM running; its ssh alias is the OS.
      - name: 'Run tests in the FreeBSD aarch64 virtual machine'
        run: |
          w="$GITHUB_WORKSPACE"
          for n in 1 2 3; do
            bad=`ssh freebsd "cd '$w/bundles' && sha256sum -c ../bundles.sha256 2>/dev/null" | sed -n 's/: FAILED$//p'`
            [ -n "$bad" ] || break
            for f in $bad; do
              ssh freebsd "cat > '$w/bundles/$f.new'" < "bundles/$f"
              ssh freebsd "cd '$w/bundles' && echo \"$f: \`cmp -l $f $f.new | wc -l\` bytes differ from a second copy; the first few (offset, damaged, good, octal):\" && cmp -l $f $f.new | head -8; mv $f.new $f"
            done
          done
          ssh freebsd "cd '$w' && TEST_SUITE='$TEST_SUITE' TIMEOUT_FACTOR='$TIMEOUT_FACTOR' SHARD='$SHARD' SHARDS='$SHARDS' sh .github/scripts/bsd-tier1-in-vm.sh '$TEST_SUITE'"
        env:
          TEST_SUITE: ${{ matrix.test-suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shard-count }}
        if: inputs.target-os == 'freebsd' && inputs.arch == 'aarch64'

      # OpenBSD refuses a writable and executable mapping on a file system
      # not mounted wxallowed, and the workspace is under /home.  The JDK
      # links against libiconv, which OpenBSD ships as a package.
      - name: 'Run tests in an OpenBSD virtual machine'
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ inputs.release }}
          arch: ${{ inputs.arch }}
          mem: 8192
          cpu: 4
          usesh: true
          copyback: true
          envs: 'TEST_SUITE TIMEOUT_FACTOR SHARD SHARDS'
          prepare: |
            mount -u -o wxallowed /home
            until pkg_add bash gmake zip unzip-- gsed ggrep libiconv; do
              echo retrying in 10 seconds; sleep 10
            done
          run: sh .github/scripts/bsd-tier1-in-vm.sh "$TEST_SUITE"
        env:
          TEST_SUITE: ${{ matrix.test-suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shard-count }}
        if: inputs.target-os == 'openbsd'

      - name: 'Run tests in a DragonFly virtual machine'
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: ${{ inputs.release }}
          mem: 8192
          cpu: 4
          usesh: true
          copyback: true
          envs: 'TEST_SUITE TIMEOUT_FACTOR SHARD SHARDS'
          prepare: |
            pkg install -y bash gmake zip unzip gsed gnugrep
          run: sh .github/scripts/bsd-tier1-in-vm.sh "$TEST_SUITE"
        env:
          TEST_SUITE: ${{ matrix.test-suite }}
          TIMEOUT_FACTOR: ${{ inputs.timeout-factor }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shard-count }}
        if: inputs.target-os == 'dragonfly'

      # Only what the steps below read, and checked: the FreeBSD aarch64
      # guest damages data it reads as well as data it writes, so a copy
      # that does not list cleanly is taken again.  The VM is still running;
      # the action leaves it to the end of the job, and its ssh alias is the
      # name of the OS.
      - name: 'Copy the test results back from the FreeBSD aarch64 guest'
        run: |
          for n in 1 2 3; do
            if ssh freebsd "cd '$GITHUB_WORKSPACE' && find build \( -name '*.jtr' -o -name summary.txt -o -name stats.txt -o -name 'hs_err_pid*.log' -o -name 'replay_pid*.log' -o -path '*/make-support/exit-with-error' -o -path '*/test-results/*' \) -type f -print | tar -czf - -T -" > results.tgz &&
               tar -tzf results.tgz > /dev/null; then
              tar -xzf results.tgz
              rm -f results.tgz
              exit 0
            fi
            echo "copy $n of the results came back damaged"
          done
          exit 1
        if: always() && inputs.target-os == 'freebsd' && inputs.arch == 'aarch64'

      - name: 'Package test results'
        run: |
          mkdir -p results
          if [ -d build ]; then
            # hs_err too.  A test that crashes leaves its .jtr saying only
            #
            #   # Problematic frame:
            #   #
            #
            # because the frame and the library map are in the hs_err file,
            # and that was not being collected.  Without it a SIGSEGV cannot
            # be attributed to anything -- java/foreign/LibraryLookupTest
            # crashed twice in the same place and there was nothing to read.
            find build -name '*.jtr' -o -name 'summary.txt' -o -name 'stats.txt' \
                       -o -name 'hs_err_pid*.log' -o -name 'replay_pid*.log' |
              while read f; do
                d="results/$(dirname "$f")"; mkdir -p "$d"; cp "$f" "$d/"
              done
          fi
        if: always()

      - name: 'Upload test results'
        uses: actions/upload-artifact@v6
        with:
          name: results-${{ inputs.platform }}-${{ matrix.test-slug }}-${{ matrix.shard }}
          path: results
          retention-days: 14
        if: always()

      # make writes its verdict to a file rather than an exit status, and the
      # VM step returns 0 so that file gets carried out.  Read it here.
      #
      # Absent results are a failure too.  If the copy back quietly does not
      # happen, an empty workspace looks exactly like a clean run, which is
      # the shape of the bug this whole path exists to stop.
      - name: 'Fail the job when a test failed'
        run: |
          R=build/run-test-prebuilt
          if [ ! -d "$R/test-results" ]; then
            echo "$R/test-results is not here.  The VM's workspace did not"
            echo "come back, so nothing can be said about the tests."
            exit 1
          fi
          if [ -f "$R/make-support/exit-with-error" ]; then
            echo "tests failed -- the names are in the log above, the .jtr"
            echo "and hs_err files in the results artifact"
            exit 1
          fi
