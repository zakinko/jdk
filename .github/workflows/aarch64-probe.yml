#
# The aarch64 BSD guests leave out a set of tests that stop making progress
# there (see the list in .github/scripts/bsd-tier1-in-vm.sh): those guests
# run under QEMU without acceleration, since the arm runners have no
# /dev/kvm.  Linux aarch64, built from this tree, stalled the same way in
# an Ubuntu guest booted the same way: tasks queued in a ForkJoinPool while
# every worker stays parked in awaitWork, or no worker exists at all.  No
# QEMU setting tried kept the tests going on four CPUs: not -cpu max, and
# not QEMU 11.1.2.
#
# This asks whose bug that is, QEMU's or the JDK's, two ways:
#   aarch64 native, one core / overloaded
#              The same tests on the arm runner itself, no emulation, but
#              with the JVMs on one core while they size their pools for
#              four, or with the cores kept busy by stress-ng.  Emulation
#              makes threads stop for long stretches at any instruction;
#              these make them do so on real hardware.  A stall here is a
#              race in the JDK that the emulation only widens.
#   x86_64 guest, emulated
#              The same tests on Linux x86_64 in an Ubuntu guest that QEMU
#              emulates, KVM taken away, on an x86_64 runner.  x86 orders
#              memory more strictly than aarch64, so if the stall needs a
#              reordering aarch64 allows, it goes away here; if it stays,
#              timing alone causes it.
#
name: 'aarch64 emulation probe'

on:
  push:
    branches:
      - claude/eloquent-dirac-pfg00n
    paths:
      - '.github/workflows/aarch64-probe.yml'
  workflow_dispatch:

jobs:
  jtreg:
    name: jtreg
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout the scripts'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf

      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build-aarch64:
    name: linux-aarch64
    needs: jtreg
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-aarch64
      runs-on: 'ubuntu-24.04-arm'
      bootjdk-platform: linux-aarch64
      gcc-major-version: '14'
      debug-levels: '[ "release" ]'

  build-x64:
    name: linux-x64
    needs: jtreg
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-x64
      gcc-major-version: '10'
      debug-levels: '[ "release" ]'

  probe:
    name: probe (${{ matrix.variant }})
    needs: [build-aarch64, build-x64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: 'aarch64 native, one core'
            runner: ubuntu-24.04-arm
            platform: linux-aarch64
            where: native
            wrap: 'taskset -c 0'
            javaopts: '-XX:ActiveProcessorCount=4'
          - variant: 'aarch64 native, overloaded'
            runner: ubuntu-24.04-arm
            platform: linux-aarch64
            where: native
            load: 16
          - variant: 'x86_64 guest, emulated'
            runner: ubuntu-24.04
            platform: linux-x64
            where: guest

    # The tests that stalled soonest in the emulated aarch64 guest.
    env:
      PROBE_TESTS: >-
        test/jdk/java/lang/Thread/virtual/stress/ParkALot.java
        test/jdk/java/lang/Thread/virtual/stress/PingPong.java
        test/jdk/java/util/concurrent/forkjoin/SubmissionTest.java
        test/jdk/java/util/concurrent/forkjoin/Starvation.java
        test/jdk/java/util/stream/GatherersMapConcurrentTest.java
        test/jdk/java/lang/Thread/virtual/CancelTimerWithContention.java
      PROBE_WRAP: ${{ matrix.wrap }}
      PROBE_JAVAOPTS: ${{ matrix.javaopts }}

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 'Get JTReg'
        uses: ./.github/actions/get-jtreg

      - name: 'Get bundles'
        uses: ./.github/actions/get-bundles
        with:
          platform: ${{ matrix.platform }}

      - name: 'Leave the symbols and the archives out'
        run: rm -rf bundles/symbols bundles/*.tar.gz

      # The same script runs on the runner and in the guest.  Each round
      # reports, per test, how long it ran, how far it got and whether its
      # thread dump has workers parked in awaitWork.
      - name: 'Write the script that runs the tests'
        run: |
          cat > probe-tests.sh <<'S'
          JDK="$PWD/bundles/jdk/`ls bundles/jdk`"
          TESTS="$PWD/bundles/tests"
          JT="$PWD/jtreg/installed"
          uname -a
          nproc
          grep -m1 -iE '^(features|flags)' /proc/cpuinfo | cut -c1-300 || :
          "$JDK/bin/java" -version
          for round in 1 2; do
            echo "=== round $round ==="
            rc=0
            $PROBE_WRAP "$JDK/bin/java" -jar "$JT/lib/jtreg.jar" -jdk:"$JDK" -agentvm \
              -conc:4 -timeoutFactor:4 -verbose:fail,error,time \
              -javaoptions:"-XX:-CreateCoredumpOnCrash $PROBE_JAVAOPTS" \
              -nativepath:"$TESTS/jdk/jtreg/native" \
              -w work$round -r report$round $PROBE_TESTS > jtreg$round.log 2>&1 || rc=$?
            echo "jtreg exited with $rc"
            echo "--- how far each test got, and how long it took ---"
            find work$round -name '*.jtr' | sort | while read -r f; do
              echo "== $f"
              grep -E '^(elapsed|test result:)' "$f"
              grep -E '=> [0-9]+ of [0-9]+|T1 [0-9]+ of [0-9]+' "$f" | tail -2
              grep -E 'awaitWork|Submitted task failed|timed out' "$f" | sort | uniq -c | head -5
            done
            echo "--- summary ---"
            cat report$round/text/summary.txt || :
          done
          echo "--- jtreg's own output, round 1 (last 300 lines) ---"
          tail -300 jtreg1.log
          S

      - name: 'Keep the cores busy'
        if: matrix.load != ''
        run: |
          sudo apt-get install -y -q --no-install-recommends stress-ng
          nohup stress-ng --cpu ${{ matrix.load }} --timeout 330m > /dev/null 2>&1 &
          sleep 5
          uptime

      - name: 'Run the tests on the runner'
        if: matrix.where == 'native'
        run: sh probe-tests.sh

      # The VM action makes /dev/kvm writable when it is there, and anyvm
      # uses KVM when it can; without the device both fall back to TCG.
      - name: 'Take KVM away'
        if: matrix.where == 'guest'
        run: |
          sudo mv /dev/kvm /dev/kvm.unused
          ls -l /dev/kvm || echo "/dev/kvm: absent, the guest will be emulated"

      - name: 'Run the tests in an emulated Linux x86_64 virtual machine'
        if: matrix.where == 'guest'
        uses: vmactions/ubuntu-vm@v1
        with:
          release: '24.04'
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'PROBE_TESTS PROBE_WRAP PROBE_JAVAOPTS'
          run: sh probe-tests.sh
