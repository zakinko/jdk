#
# The aarch64 BSD guests leave out a set of tests that stop making progress
# there (see the list in .github/scripts/bsd-tier1-in-vm.sh): tasks queued
# in a ForkJoinPool while every worker stays parked in awaitWork.  Earlier
# versions of this workflow narrowed that down: Linux aarch64 stalls the
# same way in the same emulated guest but not on the arm runner itself;
# it stalls when C2 compiles ForkJoinPool, and not with -Xint or C1 alone;
# and keeping any one of ForkJoinPool.signalWork, ForkJoinPool.deactivate
# or WorkQueue.push out of C2 is enough for it to run to the end.  Those
# three are the two sides of ForkJoinPool's handshake: the submitter
# stores a task and then reads ctl to see whether a worker is idle, the
# worker CASes itself onto ctl as idle and then reads the queues with
# plain loads.  One of them must see the other's store.
#
# Without the ARMv8.1 atomics C2 makes a CAS an ldaxr/stlxr loop with
# no barrier after it: the stlxr is a release, which orders earlier
# accesses before the store, but nothing orders the plain loads that
# follow after it.  The emulated guest is a cortex-a72, without them;
# the arm runner has them, so there C2 uses casal.
#
# This runs the store-buffering litmus test once more, on the runner and
# in the emulated guest, as cortex-a72 and as max, with a CAS followed by
# a plain load: ldaxr/stlxr;ldr, the same with dmb ish before the load,
# and casal;ldr.  Both loads seeing 0 means the load went before the
# CAS's store.
#
name: 'aarch64 emulation probe'

on:
  push:
    branches:
      - claude/eloquent-dirac-pfg00n
    paths:
      - '.github/workflows/aarch64-probe.yml'
  workflow_dispatch:

jobs:
  litmus:
    name: litmus (guest as ${{ matrix.cpu-type }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        cpu-type: [cortex-a72, max]

    steps:
      - name: 'Write the litmus test'
        run: |
          cat > sb.c <<'C'
          /*
           * Store buffering: each thread stores 1 to its own variable, then loads
           * the other's.  r0 == 0 && r1 == 0 together means a store was ordered
           * after the load that follows it in program order.  Variants:
           *   plain    str; ldr            allowed on aarch64 (and on x86)
           *   dmb      str; dmb ish; ldr   forbidden
           *   rel-acq  stlr; ldar          forbidden: a Load-Acquire is ordered
           *                                after an earlier Store-Release (RCsc)
           *   llsc     ldaxr/stlxr; ldar   forbidden: the exchange HotSpot makes
           *                                without LSE, then a Load-Acquire
           *   casal    casal; ldar         forbidden (needs LSE)
           *   llsc-ldr ldaxr/stlxr; ldr    a CAS as C2 makes it without LSE, then a
           *                                plain load: the release store does not
           *                                order later loads, so allowed
           *   casal-ldr casal; ldr         the same with LSE
           *   llsc-dmb ldaxr/stlxr; dmb ish; ldr   forbidden
           */
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #if defined(__aarch64__)
          #include <sys/auxv.h>
          #include <asm/hwcap.h>
          #endif

          #define N 20000

          static volatile long x[N], y[N];
          static long r0[N], r1[N];
          static volatile int go[2], done[2];
          static int variant;

          #if defined(__aarch64__)
          static inline void st_ld(volatile long *s, volatile long *l, long *r) {
            long v = 1, t;
            switch (variant) {
            case 0: __asm__ volatile("str %2, [%1]\n ldr %0, [%3]" : "=&r"(t) : "r"(s), "r"(v), "r"(l) : "memory"); break;
            case 1: __asm__ volatile("str %2, [%1]\n dmb ish\n ldr %0, [%3]" : "=&r"(t) : "r"(s), "r"(v), "r"(l) : "memory"); break;
            case 2: __asm__ volatile("stlr %2, [%1]\n ldar %0, [%3]" : "=&r"(t) : "r"(s), "r"(v), "r"(l) : "memory"); break;
            case 3: { long old;
              __asm__ volatile("1: ldaxr %1, [%2]\n stlxr w9, %3, [%2]\n cbnz w9, 1b\n ldar %0, [%4]"
                               : "=&r"(t), "=&r"(old) : "r"(s), "r"(v), "r"(l) : "x9", "memory"); } break;
            case 4: { long old;
              __asm__ volatile("1: ldaxr %1, [%2]\n stlxr w9, %3, [%2]\n cbnz w9, 1b\n ldr %0, [%4]"
                               : "=&r"(t), "=&r"(old) : "r"(s), "r"(v), "r"(l) : "x9", "memory"); } break;
            case 5: { long old;
              __asm__ volatile("1: ldaxr %1, [%2]\n stlxr w9, %3, [%2]\n cbnz w9, 1b\n dmb ish\n ldr %0, [%4]"
                               : "=&r"(t), "=&r"(old) : "r"(s), "r"(v), "r"(l) : "x9", "memory"); } break;
            case 6: { long old = 0;
              __asm__ volatile(".arch armv8.1-a\n casal %1, %3, [%2]\n ldar %0, [%4]" : "=&r"(t), "+&r"(old) : "r"(s), "r"(v), "r"(l) : "memory"); } break;
            default: { long old = 0;
              __asm__ volatile(".arch armv8.1-a\n casal %1, %3, [%2]\n ldr %0, [%4]" : "=&r"(t), "+&r"(old) : "r"(s), "r"(v), "r"(l) : "memory"); } break;
            }
            *r = t;
          }
          static const char *names[] = { "plain str;ldr", "str;dmb ish;ldr", "stlr;ldar", "ldaxr/stlxr;ldar",
                                          "ldaxr/stlxr;ldr", "ldaxr/stlxr;dmb;ldr", "casal;ldar", "casal;ldr" };
          static int nvariants = 8;
          #else
          static inline void st_ld(volatile long *s, volatile long *l, long *r) {
            if (variant == 0) { *s = 1; __asm__ volatile("" ::: "memory"); *r = *l; }
            else { *s = 1; __asm__ volatile("mfence" ::: "memory"); *r = *l; }
          }
          static const char *names[] = { "plain mov;mov", "mov;mfence;mov" };
          static int nvariants = 2;
          #endif

          static void *run(void *arg) {
            int me = (int)(long)arg;
            for (int round = 1; ; round++) {
              while (go[me] != round) { if (go[me] < 0) return NULL; }
              if (me == 0) for (int i = 0; i < N; i++) st_ld(&x[i], &y[i], &r0[i]);
              else         for (int i = 0; i < N; i++) st_ld(&y[i], &x[i], &r1[i]);
              __atomic_store_n(&done[me], round, __ATOMIC_SEQ_CST);
            }
          }

          int main(int argc, char **argv) {
            int rounds = argc > 1 ? atoi(argv[1]) : 200;
            pthread_t t[2];
          #if defined(__aarch64__)
            if (!(getauxval(AT_HWCAP) & HWCAP_ATOMICS)) {
              nvariants = 6;
              printf("no LSE atomics here: casal left out\n");
            }
          #endif
            for (int i = 0; i < 2; i++) pthread_create(&t[i], NULL, run, (void *)(long)i);
            int round = 0;
            for (variant = 0; variant < nvariants; variant++) {
              long seen = 0, total = 0;
              for (int k = 0; k < rounds; k++) {
                memset((void *)x, 0, sizeof x); memset((void *)y, 0, sizeof y);
                round++;
                __atomic_thread_fence(__ATOMIC_SEQ_CST);
                go[0] = round; go[1] = round;
                while (done[0] != round || done[1] != round) ;
                __atomic_thread_fence(__ATOMIC_SEQ_CST);
                for (int i = 0; i < N; i++) { total++; if (r0[i] == 0 && r1[i] == 0) seen++; }
              }
              printf("%-18s r0=0 && r1=0 in %ld of %ld\n", names[variant], seen, total);
              fflush(stdout);
            }
            go[0] = go[1] = -1;
            return 0;
          }
          C

      - name: 'Build it and run it on the runner'
        run: |
          gcc -O2 -static -pthread -o sb sb.c
          grep -m1 -i '^features' /proc/cpuinfo
          ./sb 200

      # anyvm finds QEMU on PATH, and /usr/local/bin comes before /usr/bin,
      # where the VM action's apt-get puts it.  anyvm makes the Ubuntu guest
      # a cortex-a72; the wrapper gives it the CPU of this job.
      - name: 'Put the CPU of this job in front of QEMU'
        run: |
          sudo tee /usr/local/bin/qemu-system-aarch64 > /dev/null <<'W'
          #!/bin/bash
          args=()
          while [ $# -gt 0 ]; do
            if [ "$1" = -cpu ] && [ "$2" != help ]; then
              args+=(-cpu '${{ matrix.cpu-type }}')
              shift 2
            else
              args+=("$1")
              shift
            fi
          done
          echo "${args[*]}" >> /tmp/qemu-command-lines.txt
          exec /usr/bin/qemu-system-aarch64 "${args[@]}"
          W
          sudo chmod 755 /usr/local/bin/qemu-system-aarch64

      - name: 'Run it in an emulated Linux aarch64 virtual machine'
        uses: vmactions/ubuntu-vm@v1
        with:
          release: '24.04'
          arch: aarch64
          mem: 8192
          cpu: 4
          copyback: false
          run: |
            uname -a
            nproc
            grep -m1 -i '^features' /proc/cpuinfo
            ./sb 200

      - name: 'Show the QEMU command line the guest ran with'
        if: always()
        run: |
          /usr/bin/qemu-system-aarch64 --version | head -1
          cat /tmp/qemu-command-lines.txt
