#
# The aarch64 BSD guests leave out a set of tests that stop making progress
# there (see the list in .github/scripts/bsd-tier1-in-vm.sh): tasks queued
# in a ForkJoinPool while every worker stays parked in awaitWork.  Earlier
# versions of this workflow traced that to QEMU.  Linux aarch64 stalls the
# same way in the emulated guest, only when C2 compiles ForkJoinPool's
# handshake (signalWork, deactivate, WorkQueue.push), and the
# store-buffering litmus test shows why: in the guest, a Store-Release
# followed by a Load-Acquire (stlr;ldar) let the load go first 3007 and
# 3355 times in 4000000, as max and as cortex-a72, where the architecture
# forbids it and the arm runner never did.  C2 makes a volatile store an
# stlr and a volatile load an ldar with nothing between them, relying on
# that order; C1 and the interpreter put a dmb after a volatile store.
#
# QEMU's translate-a64.c gives an stlr its barrier before the store and an
# ldar its barrier after the load, so between the two there is none, and
# the host is free to let the load pass the store.  The same holds from
# 8.2.2 to 11.1.2.  This builds QEMU 11.1.2 with a barrier before every
# load-acquire as well (ldar, and ldaxr and ldaxp), boots the same guest
# under it, and runs there the litmus test, the cut-down park/unpark and
# submission programs, and the six tests that stalled soonest.
#
name: 'aarch64 emulation probe'

on:
  push:
    branches:
      - claude/eloquent-dirac-pfg00n
    paths:
      - '.github/workflows/aarch64-probe.yml'
  workflow_dispatch:

jobs:
  jtreg:
    name: jtreg
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout the scripts'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf

      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build:
    name: linux-aarch64
    needs: jtreg
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-aarch64
      runs-on: 'ubuntu-24.04-arm'
      bootjdk-platform: linux-aarch64
      gcc-major-version: '14'
      debug-levels: '[ "release" ]'

  probe:
    name: probe (QEMU 11.1.2 with the load-acquire barrier)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    env:
      PROBE_TESTS: >-
        test/jdk/java/lang/Thread/virtual/stress/ParkALot.java
        test/jdk/java/lang/Thread/virtual/stress/PingPong.java
        test/jdk/java/util/concurrent/forkjoin/SubmissionTest.java
        test/jdk/java/util/concurrent/forkjoin/Starvation.java
        test/jdk/java/util/stream/GatherersMapConcurrentTest.java
        test/jdk/java/lang/Thread/virtual/CancelTimerWithContention.java

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 'Get JTReg'
        uses: ./.github/actions/get-jtreg

      - name: 'Get bundles'
        uses: ./.github/actions/get-bundles
        with:
          platform: linux-aarch64

      - name: 'Leave the symbols and the archives out of the guest'
        run: rm -rf bundles/symbols bundles/*.tar.gz

      - name: 'Write the programs'
        run: |
          mkdir -p probe
          cat > probe/sb.c <<'C'
          /*
           * Store buffering: each thread stores 1 to its own variable, then loads
           * the other's.  r0 == 0 && r1 == 0 together means a store was ordered
           * after the load that follows it in program order.  Variants:
           *   plain    str; ldr            allowed on aarch64 (and on x86)
           *   dmb      str; dmb ish; ldr   forbidden
           *   rel-acq  stlr; ldar          forbidden: a Load-Acquire is ordered
           *                                after an earlier Store-Release (RCsc)
           *   llsc     ldaxr/stlxr; ldar   forbidden: the exchange HotSpot makes
           *                                without LSE, then a Load-Acquire
           *   casal    casal; ldar         forbidden (needs LSE)
           *   llsc-ldr ldaxr/stlxr; ldr    a CAS as C2 makes it without LSE, then a
           *                                plain load: the release store does not
           *                                order later loads, so allowed
           *   casal-ldr casal; ldr         the same with LSE
           *   llsc-dmb ldaxr/stlxr; dmb ish; ldr   forbidden
           */
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #if defined(__aarch64__)
          #include <sys/auxv.h>
          #include <asm/hwcap.h>
          #endif

          #define N 20000

          static volatile long x[N], y[N];
          static long r0[N], r1[N];
          static volatile int go[2], done[2];
          static int variant;

          #if defined(__aarch64__)
          static inline void st_ld(volatile long *s, volatile long *l, long *r) {
            long v = 1, t;
            switch (variant) {
            case 0: __asm__ volatile("str %2, [%1]\n ldr %0, [%3]" : "=&r"(t) : "r"(s), "r"(v), "r"(l) : "memory"); break;
            case 1: __asm__ volatile("str %2, [%1]\n dmb ish\n ldr %0, [%3]" : "=&r"(t) : "r"(s), "r"(v), "r"(l) : "memory"); break;
            case 2: __asm__ volatile("stlr %2, [%1]\n ldar %0, [%3]" : "=&r"(t) : "r"(s), "r"(v), "r"(l) : "memory"); break;
            case 3: { long old;
              __asm__ volatile("1: ldaxr %1, [%2]\n stlxr w9, %3, [%2]\n cbnz w9, 1b\n ldar %0, [%4]"
                               : "=&r"(t), "=&r"(old) : "r"(s), "r"(v), "r"(l) : "x9", "memory"); } break;
            case 4: { long old;
              __asm__ volatile("1: ldaxr %1, [%2]\n stlxr w9, %3, [%2]\n cbnz w9, 1b\n ldr %0, [%4]"
                               : "=&r"(t), "=&r"(old) : "r"(s), "r"(v), "r"(l) : "x9", "memory"); } break;
            case 5: { long old;
              __asm__ volatile("1: ldaxr %1, [%2]\n stlxr w9, %3, [%2]\n cbnz w9, 1b\n dmb ish\n ldr %0, [%4]"
                               : "=&r"(t), "=&r"(old) : "r"(s), "r"(v), "r"(l) : "x9", "memory"); } break;
            case 6: { long old = 0;
              __asm__ volatile(".arch armv8.1-a\n casal %1, %3, [%2]\n ldar %0, [%4]" : "=&r"(t), "+&r"(old) : "r"(s), "r"(v), "r"(l) : "memory"); } break;
            default: { long old = 0;
              __asm__ volatile(".arch armv8.1-a\n casal %1, %3, [%2]\n ldr %0, [%4]" : "=&r"(t), "+&r"(old) : "r"(s), "r"(v), "r"(l) : "memory"); } break;
            }
            *r = t;
          }
          static const char *names[] = { "plain str;ldr", "str;dmb ish;ldr", "stlr;ldar", "ldaxr/stlxr;ldar",
                                          "ldaxr/stlxr;ldr", "ldaxr/stlxr;dmb;ldr", "casal;ldar", "casal;ldr" };
          static int nvariants = 8;
          #else
          static inline void st_ld(volatile long *s, volatile long *l, long *r) {
            if (variant == 0) { *s = 1; __asm__ volatile("" ::: "memory"); *r = *l; }
            else { *s = 1; __asm__ volatile("mfence" ::: "memory"); *r = *l; }
          }
          static const char *names[] = { "plain mov;mov", "mov;mfence;mov" };
          static int nvariants = 2;
          #endif

          static void *run(void *arg) {
            int me = (int)(long)arg;
            for (int round = 1; ; round++) {
              while (go[me] != round) { if (go[me] < 0) return NULL; }
              if (me == 0) for (int i = 0; i < N; i++) st_ld(&x[i], &y[i], &r0[i]);
              else         for (int i = 0; i < N; i++) st_ld(&y[i], &x[i], &r1[i]);
              __atomic_store_n(&done[me], round, __ATOMIC_SEQ_CST);
            }
          }

          int main(int argc, char **argv) {
            int rounds = argc > 1 ? atoi(argv[1]) : 200;
            pthread_t t[2];
          #if defined(__aarch64__)
            if (!(getauxval(AT_HWCAP) & HWCAP_ATOMICS)) {
              nvariants = 6;
              printf("no LSE atomics here: casal left out\n");
            }
          #endif
            for (int i = 0; i < 2; i++) pthread_create(&t[i], NULL, run, (void *)(long)i);
            int round = 0;
            for (variant = 0; variant < nvariants; variant++) {
              long seen = 0, total = 0;
              for (int k = 0; k < rounds; k++) {
                memset((void *)x, 0, sizeof x); memset((void *)y, 0, sizeof y);
                round++;
                __atomic_thread_fence(__ATOMIC_SEQ_CST);
                go[0] = round; go[1] = round;
                while (done[0] != round || done[1] != round) ;
                __atomic_thread_fence(__ATOMIC_SEQ_CST);
                for (int i = 0; i < N; i++) { total++; if (r0[i] == 0 && r1[i] == 0) seen++; }
              }
              printf("%-18s r0=0 && r1=0 in %ld of %ld\n", names[variant], seen, total);
              fflush(stdout);
            }
            go[0] = go[1] = -1;
            return 0;
          }
          C
          cat > probe/Repro.java <<'J'
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.ForkJoinPool;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicInteger;
          import java.util.concurrent.locks.LockSupport;

          /**
           * The two stalls the emulated aarch64 guest shows, cut down to nothing but
           * the JDK.  Prints PASS or STALL and exits.
           *   parkalot N   a virtual thread parks N times, a platform thread unparks
           *                it each time it waits (ParkALot with one thread)
           *   submit N     N times: a task handed to a fresh ForkJoinPool(1) must run
           *                within 60 seconds (SubmissionTest)
           */
          public class Repro {
              public static void main(String[] args) throws Exception {
                  int n = Integer.parseInt(args[1]);
                  boolean ok = switch (args[0]) {
                      case "parkalot" -> parkALot(n);
                      case "submit" -> submit(n);
                      default -> throw new IllegalArgumentException(args[0]);
                  };
                  System.out.println(ok ? "PASS" : "STALL");
                  System.exit(ok ? 0 : 1);
              }

              static boolean parkALot(int n) throws Exception {
                  AtomicInteger done = new AtomicInteger();
                  Thread vthread = Thread.ofVirtual().start(() -> {
                      boolean timed = false;
                      for (int i = 0; i < n; i++) {
                          if (timed) LockSupport.parkNanos(Long.MAX_VALUE); else LockSupport.park();
                          timed = !timed;
                          done.incrementAndGet();
                      }
                  });
                  Thread unparker = Thread.ofPlatform().daemon().start(() -> {
                      Thread.State s;
                      while ((s = vthread.getState()) != Thread.State.TERMINATED) {
                          if (s == Thread.State.WAITING || s == Thread.State.TIMED_WAITING) {
                              LockSupport.unpark(vthread);
                          } else {
                              Thread.yield();
                          }
                      }
                  });
                  int last = -1;
                  long stuckSince = System.nanoTime();
                  while (!vthread.join(java.time.Duration.ofSeconds(1))) {
                      int d = done.get();
                      if (d != last) {
                          last = d;
                          stuckSince = System.nanoTime();
                      } else if (System.nanoTime() - stuckSince > TimeUnit.SECONDS.toNanos(60)) {
                          System.out.println("no progress for 60s at " + d + " of " + n
                                  + ", virtual thread " + vthread.getState());
                          return false;
                      }
                  }
                  System.out.println(done.get() + " of " + n);
                  return true;
              }

              static boolean submit(int n) throws Exception {
                  for (int i = 0; i < n; i++) {
                      ForkJoinPool pool = new ForkJoinPool(1);
                      CountDownLatch ran = new CountDownLatch(1);
                      pool.execute(ran::countDown);
                      boolean ok = ran.await(60, TimeUnit.SECONDS);
                      pool.shutdownNow();
                      if (!ok) {
                          System.out.println("task " + i + " of " + n + " did not run in 60s; pool: " + pool);
                          return false;
                      }
                  }
                  System.out.println(n + " of " + n);
                  return true;
              }
          }
          J
          cat > probe/ldar.patch <<'P'
          --- a/target/arm/tcg/translate-a64.c
          +++ b/target/arm/tcg/translate-a64.c
          @@ -3642,6 +3642,9 @@
               if (a->rn == 31) {
                   gen_check_sp_alignment(s);
               }
          +    if (a->lasr) {
          +        tcg_gen_mb(TCG_MO_ALL | TCG_BAR_SC);
          +    }
               gen_load_exclusive(s, a->rt, a->rt2, a->rn, a->sz, false);
               if (a->lasr) {
                   tcg_gen_mb(TCG_MO_ALL | TCG_BAR_LDAQ);
          @@ -3689,6 +3692,12 @@
               if (a->rn == 31) {
                   gen_check_sp_alignment(s);
               }
          +    /*
          +     * A Load-Acquire is ordered after any earlier Store-Release (the
          +     * acquire is RCsc), and the barrier the store-release gets goes in
          +     * before its store, so one is needed here as well.
          +     */
          +    tcg_gen_mb(TCG_MO_ALL | TCG_BAR_SC);
               memop = check_ordered_align(s, a->rn, 0, false, a->sz);
               clean_addr = gen_mte_check1(s, cpu_reg_sp(s, a->rn),
                                           false, a->rn != 31, memop);
          @@ -3715,6 +3724,9 @@
               if (a->rn == 31) {
                   gen_check_sp_alignment(s);
               }
          +    if (a->lasr) {
          +        tcg_gen_mb(TCG_MO_ALL | TCG_BAR_SC);
          +    }
               gen_load_exclusive(s, a->rt, a->rt2, a->rn, a->sz, true);
               if (a->lasr) {
                   tcg_gen_mb(TCG_MO_ALL | TCG_BAR_LDAQ);
          P
          cat > probe/run.sh <<'S'
          JDK="$PWD/bundles/jdk/`ls bundles/jdk`"
          TESTS="$PWD/bundles/tests"
          JT="$PWD/jtreg/installed"
          uname -a
          nproc
          grep -m1 -i '^features' /proc/cpuinfo
          ./probe/sb 200
          for round in 1 2; do
            for t in "parkalot 100000" "submit 300"; do
              start=`date +%s`
              out=`timeout 1200 "$JDK/bin/java" -cp probe Repro $t 2>&1 < /dev/null | tail -2 | tr '\n' ' '`
              end=`date +%s`
              echo "round $round | $t | $((end - start))s | $out"
            done
          done
          rc=0
          "$JDK/bin/java" -jar "$JT/lib/jtreg.jar" -jdk:"$JDK" -agentvm \
            -conc:4 -timeoutFactor:4 -verbose:fail,error,time \
            -javaoption:-XX:-CreateCoredumpOnCrash \
            -nativepath:"$TESTS/jdk/jtreg/native" \
            -w work -r report $PROBE_TESTS > jtreg.log 2>&1 || rc=$?
          echo "jtreg exited with $rc"
          find work -name '*.jtr' | sort | while read -r f; do
            echo "== $f"
            grep -E '^(elapsed|test result:)' "$f"
            grep -E '=> [0-9]+ of [0-9]+|T1 [0-9]+ of [0-9]+' "$f" | tail -1
            grep -E 'awaitWork|Submitted task failed' "$f" | sort | uniq -c | head -3
          done
          cat report/text/summary.txt || :
          S

      - name: 'Build the programs and run them on the runner'
        run: |
          gcc -O2 -static -pthread -o probe/sb probe/sb.c
          "bundles/jdk/`ls bundles/jdk`/bin/javac" -d probe probe/Repro.java
          ./probe/sb 200

      - name: 'Build QEMU 11.1.2 with the load-acquire barrier'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build \
            libglib2.0-dev libpixman-1-dev libslirp-dev python3-venv flex bison
          curl -sSfL https://download.qemu.org/qemu-11.1.2.tar.xz | tar -xJf -
          cd qemu-11.1.2
          patch -p1 < ../probe/ldar.patch
          ./configure --prefix=/opt/qemu --target-list=aarch64-softmmu \
            --enable-slirp --disable-docs --disable-werror
          make -j"$(nproc)" > ../qemu-build.log 2>&1 || { tail -50 ../qemu-build.log; exit 1; }
          sudo make install > /dev/null
          cd ..
          rm -rf qemu-11.1.2
          /opt/qemu/bin/qemu-system-aarch64 --version

      # anyvm finds QEMU on PATH, and /usr/local/bin comes before /usr/bin,
      # where the VM action's apt-get puts the runner's.
      - name: "Put the patched QEMU in front of the runner's"
        run: |
          sudo tee /usr/local/bin/qemu-system-aarch64 > /dev/null <<'W'
          #!/bin/sh
          echo "$*" >> /tmp/qemu-command-lines.txt
          exec /opt/qemu/bin/qemu-system-aarch64 "$@"
          W
          sudo chmod 755 /usr/local/bin/qemu-system-aarch64

      - name: 'Run them in the emulated Linux aarch64 virtual machine'
        uses: vmactions/ubuntu-vm@v1
        with:
          release: '24.04'
          arch: aarch64
          mem: 8192
          cpu: 4
          copyback: false
          envs: 'PROBE_TESTS'
          run: sh probe/run.sh

      - name: 'Show the QEMU command line the guest ran with'
        if: always()
        run: cat /tmp/qemu-command-lines.txt
