#
# The aarch64 BSD guests leave out a set of tests that stop making progress
# there (see the list in .github/scripts/bsd-tier1-in-vm.sh): those guests
# run under QEMU without acceleration, since the arm runners have no
# /dev/kvm.  Run on Linux aarch64, built from this tree, in an Ubuntu guest
# that the same anyvm boots on the same runner, the same tests stalled the
# same way, so the emulation stalls them, not the BSD port: tasks queued in
# a ForkJoinPool while every worker stays parked in awaitWork.
#
# This looks for QEMU settings under which they do not stall, so that the
# BSD guests can be run with them and the tests put back.  Each variant
# boots the same Ubuntu guest and runs the same tests twice; anyvm has no
# option for the TCG thread model or, through the VM action, the CPU model,
# so a wrapper in front of qemu-system-aarch64 rewrites its command line.
#   mttcg      what the guests get now: cortex-a72 (anyvm's model for
#              Ubuntu and NetBSD 10.1), four CPUs, one host thread each
#   single     the same, with every vCPU on one host thread
#              (-accel tcg,thread=single)
#   one-cpu    one CPU, so nothing runs in parallel in the guest
#   max        -cpu max, which adds the ARMv8.1 atomics (LSE), so CAS is
#              no longer a load-exclusive/store-exclusive loop
#
name: 'aarch64 emulation probe'

on:
  push:
    branches:
      - claude/eloquent-dirac-pfg00n
    paths:
      - '.github/workflows/aarch64-probe.yml'
  workflow_dispatch:

jobs:
  jtreg:
    name: jtreg
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout the scripts'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf

      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build:
    name: linux-aarch64
    needs: jtreg
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-aarch64
      runs-on: 'ubuntu-24.04-arm'
      bootjdk-platform: linux-aarch64
      gcc-major-version: '14'
      debug-levels: '[ "release" ]'

  probe:
    name: probe (${{ matrix.variant }})
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: mttcg,   cpus: 4, tcg-thread: '',       cpu-type: ''}
          - {variant: single,  cpus: 4, tcg-thread: 'single', cpu-type: ''}
          - {variant: one-cpu, cpus: 1, tcg-thread: '',       cpu-type: ''}
          - {variant: max,     cpus: 4, tcg-thread: '',       cpu-type: 'max'}

    # The tests that stalled soonest in the first probe, with jtreg's
    # timeout factor at four so that a stall costs minutes, not hours.
    # ParkALot stopped advancing seconds into its run; PingPong#ltq within
    # two minutes; SubmissionTest waits two minutes for a task that never
    # runs.
    env:
      PROBE_TESTS: >-
        test/jdk/java/lang/Thread/virtual/stress/ParkALot.java
        test/jdk/java/lang/Thread/virtual/stress/PingPong.java
        test/jdk/java/util/concurrent/forkjoin/SubmissionTest.java
        test/jdk/java/util/concurrent/forkjoin/Starvation.java
        test/jdk/java/util/stream/GatherersMapConcurrentTest.java
        test/jdk/java/lang/Thread/virtual/CancelTimerWithContention.java

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 'Get JTReg'
        uses: ./.github/actions/get-jtreg

      - name: 'Get bundles'
        uses: ./.github/actions/get-bundles
        with:
          platform: linux-aarch64

      - name: 'Leave the symbols and the archives out of the guest'
        run: rm -rf bundles/symbols bundles/*.tar.gz

      - name: 'Say whether this runner can accelerate a guest'
        run: |
          echo "runner: ${{ runner.os }} ${{ runner.arch }}"
          ls -l /dev/kvm || echo "/dev/kvm: absent, the guest will be emulated"

      # anyvm finds QEMU on PATH, and /usr/local/bin comes before /usr/bin,
      # where the VM action's apt-get puts it.  -machine carries accel=tcg,
      # which QEMU will not take together with -accel, so it comes out of
      # there when -accel goes in.  Every command line is kept, to show what
      # the guest really ran with.
      - name: 'Put the settings of this variant in front of QEMU'
        if: matrix.tcg-thread != '' || matrix.cpu-type != ''
        run: |
          sudo tee /usr/local/bin/qemu-system-aarch64 > /dev/null <<'W'
          #!/bin/bash
          TCG_THREAD='${{ matrix.tcg-thread }}'
          CPU_TYPE='${{ matrix.cpu-type }}'
          args=()
          while [ $# -gt 0 ]; do
            case "$1" in
              -machine)
                m=$2
                if [ -n "$TCG_THREAD" ]; then
                  m=${m/,accel=tcg/}
                  m=${m/accel=tcg,/}
                fi
                args+=(-machine "$m")
                if [ -n "$TCG_THREAD" ]; then
                  args+=(-accel "tcg,thread=$TCG_THREAD")
                fi
                shift 2 ;;
              -cpu)
                if [ -n "$CPU_TYPE" ] && [ "$2" != help ]; then
                  args+=(-cpu "$CPU_TYPE")
                else
                  args+=(-cpu "$2")
                fi
                shift 2 ;;
              *)
                args+=("$1")
                shift ;;
            esac
          done
          echo "${args[*]}" >> /tmp/qemu-command-lines.txt
          exec /usr/bin/qemu-system-aarch64 "${args[@]}"
          W
          sudo chmod 755 /usr/local/bin/qemu-system-aarch64

      - name: 'Run the tests in a Linux aarch64 virtual machine'
        uses: vmactions/ubuntu-vm@v1
        with:
          release: '24.04'
          arch: aarch64
          mem: 8192
          cpu: ${{ matrix.cpus }}
          copyback: false
          envs: 'PROBE_TESTS'
          run: |
            uname -a
            nproc
            grep -m1 -i '^features' /proc/cpuinfo || :
            JDK="$PWD/bundles/jdk/`ls bundles/jdk`"
            TESTS="$PWD/bundles/tests"
            JT="$PWD/jtreg/installed"
            "$JDK/bin/java" -version
            for round in 1 2; do
              echo "=== round $round ==="
              rc=0
              "$JDK/bin/java" -jar "$JT/lib/jtreg.jar" -jdk:"$JDK" -agentvm \
                -conc:4 -timeoutFactor:4 -verbose:fail,error,time \
                -javaoption:-XX:-CreateCoredumpOnCrash \
                -nativepath:"$TESTS/jdk/jtreg/native" \
                -w work$round -r report$round $PROBE_TESTS > jtreg$round.log 2>&1 || rc=$?
              echo "jtreg exited with $rc"
              echo "--- how far each test got, and how long it took ---"
              find work$round -name '*.jtr' | sort | while read -r f; do
                echo "== $f"
                grep -E '^(elapsed|test result:)' "$f"
                grep -E '=> [0-9]+ of [0-9]+|T1 [0-9]+ of [0-9]+' "$f" | tail -2
                grep -E 'awaitWork|Submitted task failed|timed out' "$f" | sort | uniq -c | head -5
              done
              echo "--- summary ---"
              cat report$round/text/summary.txt || :
            done
            echo "--- jtreg's own output, round 1 (last 300 lines) ---"
            tail -300 jtreg1.log

      - name: 'Show the QEMU command line the guest ran with'
        if: always()
        run: cat /tmp/qemu-command-lines.txt 2>/dev/null || echo "QEMU ran as anyvm started it"
