#
# The aarch64 BSD guests leave out a set of tests that stop making progress
# there (see the list in .github/scripts/bsd-tier1-in-vm.sh): tasks queued
# in a ForkJoinPool while every worker stays parked in awaitWork.  Earlier
# versions of this workflow found that Linux aarch64 stalls the same way in
# the same emulated guest, under QEMU 8.2.2 and 11.1.2, as cortex-a72 and
# as max, but not on the arm runner itself, held to one core or with every
# core kept busy, and not as x86_64 in a guest emulated on an x86_64
# runner.  A store-buffering litmus test then found the emulated aarch64
# guest ordering a Load-Acquire after a Store-Release, a load after
# dmb ish, and after an exclusive store-release, as the architecture asks:
# 0 of 4000000 each, where plain str;ldr was reordered 252 times.  So the
# memory model is emulated right, at least there.
#
# Two small programs then showed where: a virtual thread parked again and
# again while a platform thread unparks it stalls in the emulated guest
# by default, with C2 alone and with the Serial collector, and runs to
# the end with -Xint and with C1 alone, in both rounds; a task given to a
# fresh ForkJoinPool(1), and a C program handing a token over through a
# mutex and condition variable, never stall.  C2's code is what stalls.
#
# With the park/unpark program alone, keeping ForkJoinPool's classes out
# of the compilers made it run to the end in both rounds; changing the
# instruction C2 gives Thread.onSpinWait(), leaving dmb instructions
# unmerged, and keeping VirtualThread, Continuation, LockSupport with
# Unsafe, Thread or the program's own classes out did not.
#
# This narrows it down to ForkJoinPool's methods: each of signalWork,
# deactivate, awaitWork, runWorker, WorkQueue.push, all of WorkQueue, and
# the submission path is kept out of the compilers and out of other
# methods' inlined code in turn; and, last, all of ForkJoinPool is
# compiled but nothing of it inlined.
#
name: 'aarch64 emulation probe'

on:
  push:
    branches:
      - claude/eloquent-dirac-pfg00n
    paths:
      - '.github/workflows/aarch64-probe.yml'
  workflow_dispatch:

jobs:
  jtreg:
    name: jtreg
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout the scripts'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf

      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build:
    name: linux-aarch64
    needs: jtreg
    uses: ./.github/workflows/build-linux.yml
    with:
      platform: linux-aarch64
      runs-on: 'ubuntu-24.04-arm'
      bootjdk-platform: linux-aarch64
      gcc-major-version: '14'
      debug-levels: '[ "release" ]'

  probe:
    name: probe
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github

      - name: 'Get bundles'
        uses: ./.github/actions/get-bundles
        with:
          platform: linux-aarch64

      - name: 'Leave out what the guest does not need'
        run: rm -rf bundles/symbols bundles/tests bundles/*.tar.gz

      - name: 'Write the programs'
        run: |
          mkdir -p repro
          cat > repro/Repro.java <<'J'
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.ForkJoinPool;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.atomic.AtomicInteger;
          import java.util.concurrent.locks.LockSupport;

          /**
           * The two stalls the emulated aarch64 guest shows, cut down to nothing but
           * the JDK.  Prints PASS or STALL and exits.
           *   parkalot N   a virtual thread parks N times, a platform thread unparks
           *                it each time it waits (ParkALot with one thread)
           *   submit N     N times: a task handed to a fresh ForkJoinPool(1) must run
           *                within 60 seconds (SubmissionTest)
           */
          public class Repro {
              public static void main(String[] args) throws Exception {
                  int n = Integer.parseInt(args[1]);
                  boolean ok = switch (args[0]) {
                      case "parkalot" -> parkALot(n);
                      case "submit" -> submit(n);
                      default -> throw new IllegalArgumentException(args[0]);
                  };
                  System.out.println(ok ? "PASS" : "STALL");
                  System.exit(ok ? 0 : 1);
              }

              static boolean parkALot(int n) throws Exception {
                  AtomicInteger done = new AtomicInteger();
                  Thread vthread = Thread.ofVirtual().start(() -> {
                      boolean timed = false;
                      for (int i = 0; i < n; i++) {
                          if (timed) LockSupport.parkNanos(Long.MAX_VALUE); else LockSupport.park();
                          timed = !timed;
                          done.incrementAndGet();
                      }
                  });
                  Thread unparker = Thread.ofPlatform().daemon().start(() -> {
                      Thread.State s;
                      while ((s = vthread.getState()) != Thread.State.TERMINATED) {
                          if (s == Thread.State.WAITING || s == Thread.State.TIMED_WAITING) {
                              LockSupport.unpark(vthread);
                          } else {
                              Thread.yield();
                          }
                      }
                  });
                  int last = -1;
                  long stuckSince = System.nanoTime();
                  while (!vthread.join(java.time.Duration.ofSeconds(1))) {
                      int d = done.get();
                      if (d != last) {
                          last = d;
                          stuckSince = System.nanoTime();
                      } else if (System.nanoTime() - stuckSince > TimeUnit.SECONDS.toNanos(60)) {
                          System.out.println("no progress for 60s at " + d + " of " + n
                                  + ", virtual thread " + vthread.getState());
                          return false;
                      }
                  }
                  System.out.println(done.get() + " of " + n);
                  return true;
              }

              static boolean submit(int n) throws Exception {
                  for (int i = 0; i < n; i++) {
                      ForkJoinPool pool = new ForkJoinPool(1);
                      CountDownLatch ran = new CountDownLatch(1);
                      pool.execute(ran::countDown);
                      boolean ok = ran.await(60, TimeUnit.SECONDS);
                      pool.shutdownNow();
                      if (!ok) {
                          System.out.println("task " + i + " of " + n + " did not run in 60s; pool: " + pool);
                          return false;
                      }
                  }
                  System.out.println(n + " of " + n);
                  return true;
              }
          }
          J
          cat > repro/condvar.c <<'C'
          /*
           * Two threads hand a token back and forth through a mutex and a condition
           * variable, the way HotSpot's Parker parks and unparks, N times.  A lost
           * wakeup leaves both waiting; the main thread reports it.
           */
          #include <pthread.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <time.h>
          #include <unistd.h>

          static pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;
          static pthread_cond_t c[2] = { PTHREAD_COND_INITIALIZER, PTHREAD_COND_INITIALIZER };
          static volatile int turn, n;
          static volatile long count;

          static void *run(void *arg) {
            int me = (int)(long)arg;
            for (int i = 0; i < n; i++) {
              pthread_mutex_lock(&m);
              while (turn != me) pthread_cond_wait(&c[me], &m);
              turn = 1 - me;
              count++;
              pthread_cond_signal(&c[1 - me]);
              pthread_mutex_unlock(&m);
            }
            return NULL;
          }

          int main(int argc, char **argv) {
            n = argc > 1 ? atoi(argv[1]) : 1000000;
            pthread_t t[2];
            for (int i = 0; i < 2; i++) pthread_create(&t[i], NULL, run, (void *)(long)i);
            long last = -1;
            int still = 0;
            while (count < 2L * n) {
              sleep(1);
              if (count == last) {
                if (++still >= 60) { printf("condvar: STALL at %ld of %ld\n", count, 2L * n); return 1; }
              } else { still = 0; last = count; }
            }
            printf("condvar: PASS, %ld handoffs\n", count);
            return 0;
          }
          C
          cat > repro/run.sh <<'S'
          JAVA="$PWD/bundles/jdk/`ls bundles/jdk`/bin/java"
          uname -a
          nproc
          grep -m1 -i '^features' /proc/cpuinfo
          cat > repro/variants <<'V'
          default
          -XX:CompileCommand=quiet -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool::signalWork -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool::signalWork
          -XX:CompileCommand=quiet -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool::deactivate -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool::deactivate
          -XX:CompileCommand=quiet -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool::awaitWork -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool::awaitWork
          -XX:CompileCommand=quiet -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool::runWorker -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool::runWorker
          -XX:CompileCommand=quiet -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool$WorkQueue::push -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool$WorkQueue::push
          -XX:CompileCommand=quiet -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool$WorkQueue::* -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool$WorkQueue::*
          -XX:CompileCommand=quiet -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool::poolSubmit -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool::poolSubmit -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool::externalSubmit -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool::externalSubmit -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool::lazySubmit -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool::lazySubmit -XX:CompileCommand=exclude,java.util.concurrent.ForkJoinPool::submissionQueue -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool::submissionQueue
          -XX:CompileCommand=quiet -XX:CompileCommand=dontinline,java.util.concurrent.ForkJoinPool*::*
          V
          for round in 1 2; do
            while read -r opts; do
              [ "$opts" = default ] && o= || o=$opts
              start=`date +%s`
              out=`timeout 1200 "$JAVA" $o -cp repro Repro parkalot 100000 2>&1 < /dev/null | tail -2 | tr '\n' ' '`
              end=`date +%s`
              echo "round $round | $opts | $((end - start))s | $out"
            done < repro/variants
          done
          S

      - name: 'Build the programs and run them on the runner'
        run: |
          gcc -O2 -static -pthread -o repro/condvar repro/condvar.c
          "bundles/jdk/`ls bundles/jdk`/bin/javac" -d repro repro/Repro.java
          sh repro/run.sh

      - name: 'Run them in an emulated Linux aarch64 virtual machine'
        uses: vmactions/ubuntu-vm@v1
        with:
          release: '24.04'
          arch: aarch64
          mem: 8192
          cpu: 4
          copyback: false
          run: sh repro/run.sh
